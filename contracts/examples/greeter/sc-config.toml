# Not generated by `sc-meta new --template empty` — confirmed empirically
# while authoring this recipe: a freshly scaffolded "empty" contract has
# no sc-config.toml at all. It's only needed once you want proxy
# generation (or a multi-contract build), so it's added here as the
# first real step past the bare scaffold.
[[proxy]]
path = "src/greeter_proxy.rs"
