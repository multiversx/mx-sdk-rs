[package]
name = "large-vec-storage-interactor"
version = "0.0.0"
authors = ["Andrei Marinica <andrei.marinica@multiversx.com>"]
edition = "2024"
publish = false

[[bin]]
name = "large-vec-storage-interactor"
path = "src/lvs_interactor_main.rs"

[lib]
path = "src/lvs_interactor.rs"

[dependencies.large-vec-storage]
path = ".."

[dependencies.multiversx-sc-snippets]
version = "0.66.3"
path = "../../../../framework/snippets"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
tokio = { version = "1.24" }

[dev-dependencies]
serial_test = "3.2.0"

[features]
chain-simulator-tests = []
